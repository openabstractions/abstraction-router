name: CodeQL

# Publish as .github/workflows/codeql.yml, then switch repository code scanning
# from default setup to advanced setup. Keep all previously analyzed languages;
# header-only C++ clients need a translation unit rather than an empty autobuild.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(github.event.repository.name == 'abstraction-config' && '["c-cpp","go","python","actions"]' || '["c-cpp","go","actions"]') }}
    env:
      GOWORK: 'off'
      REPOSITORY: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: ${{ matrix.language == 'actions' && '.' || github.event.repository.name }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.language == 'c-cpp' || matrix.language == 'go'
        with:
          go-version-file: ${{ github.event.repository.name }}/go/go.mod
          cache: false
      - name: resolve released sibling versions
        id: siblings
        if: matrix.language == 'c-cpp'
        env:
          MODULE: ${{ github.event.repository.name }}/go
          # identity's headers every client compiles against; facade's aggregate includes the rest.
          SIBLINGS: ${{ github.event.repository.name == 'abstraction-facade' && 'abstraction-identity abstraction-job abstraction-logging abstraction-config abstraction-router abstraction-storage abstraction-model abstraction-download' || 'abstraction-identity' }}
        run: |
          # Each sibling at the release tag of the version this repository's
          # go.mod requires: the dependency is declared once, in the manifest,
          # and CI builds what an adopter of those versions builds (VISION
          # 2026-10-08). A repository's C++ sources ship at its Go module's tag:
          # go/vX for a module under go/, vX for a root module. It runs with the
          # Go toolchain setup-go installed, which every runner and the stage have.
          mkdir -p "$RUNNER_TEMP/siblings"
          cat > "$RUNNER_TEMP/siblings/main.go" <<'GO'
          package main

          import (
          	"encoding/json"
          	"fmt"
          	"os"
          	"os/exec"
          	"regexp"
          	"strings"
          )

          func main() {
          	cmd := exec.Command("go", "mod", "edit", "-json")
          	cmd.Dir = os.Args[1]
          	raw, err := cmd.Output()
          	if err != nil {
          		fmt.Fprintln(os.Stderr, "FAIL go mod edit -json in", os.Args[1]+":", err)
          		os.Exit(1)
          	}
          	var module struct{ Require []struct{ Path, Version string } }
          	if err := json.Unmarshal(raw, &module); err != nil {
          		fmt.Fprintln(os.Stderr, "FAIL", err)
          		os.Exit(1)
          	}
          	sibling := regexp.MustCompile(`^github\.com/openabstractions/(abstraction-[a-z0-9-]+)(?:/(.+))?$`)
          	pseudo := regexp.MustCompile(`\d{14}-[0-9a-f]{12}$`)
          	tags, ranks := map[string]string{}, map[string]int{}
          	for _, r := range module.Require {
          		m := sibling.FindStringSubmatch(r.Path)
          		if m == nil {
          			continue
          		}
          		rank, tag := 1, r.Version
          		if m[2] != "" {
          			rank, tag = 2, m[2]+"/"+r.Version
          			if m[2] == "go" {
          				rank = 0
          			}
          		}
          		if old, ok := ranks[m[1]]; !ok || rank < old {
          			tags[m[1]], ranks[m[1]] = tag, rank
          		}
          	}
          	var lines, problems []string
          	for _, name := range os.Args[2:] {
          		tag := tags[name]
          		switch {
          		case tag == "":
          			problems = append(problems, name+" is not required by "+os.Args[1]+"/go.mod; declare its released version there")
          		case pseudo.MatchString(tag):
          			problems = append(problems, name+" "+tag+" is a pseudo-version, not a released tag")
          		}
          		lines = append(lines, strings.TrimPrefix(name, "abstraction-")+"="+tag)
          	}
          	if len(problems) > 0 {
          		fmt.Fprintln(os.Stderr, "FAIL "+strings.Join(problems, "\nFAIL "))
          		os.Exit(1)
          	}
          	output, err := os.OpenFile(os.Getenv("GITHUB_OUTPUT"), os.O_APPEND|os.O_WRONLY, 0)
          	if err != nil {
          		fmt.Fprintln(os.Stderr, "FAIL", err)
          		os.Exit(1)
          	}
          	defer output.Close()
          	fmt.Fprint(output, strings.Join(lines, "\n")+"\n")
          	fmt.Println(strings.Join(lines, "\n"))
          }
          GO
          go run "$RUNNER_TEMP/siblings/main.go" "$MODULE" $SIBLINGS
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: matrix.language == 'c-cpp'
        with:
          repository: openabstractions/abstraction-identity
          ref: ${{ steps.siblings.outputs.identity }}
          path: abstraction-identity
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: matrix.language == 'c-cpp' && github.event.repository.name == 'abstraction-facade'
        with:
          repository: openabstractions/abstraction-job
          ref: ${{ steps.siblings.outputs.job }}
          path: abstraction-job
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: matrix.language == 'c-cpp' && github.event.repository.name == 'abstraction-facade'
        with:
          repository: openabstractions/abstraction-logging
          ref: ${{ steps.siblings.outputs.logging }}
          path: abstraction-logging
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: matrix.language == 'c-cpp' && github.event.repository.name == 'abstraction-facade'
        with:
          repository: openabstractions/abstraction-config
          ref: ${{ steps.siblings.outputs.config }}
          path: abstraction-config
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: matrix.language == 'c-cpp' && github.event.repository.name == 'abstraction-facade'
        with:
          repository: openabstractions/abstraction-router
          ref: ${{ steps.siblings.outputs.router }}
          path: abstraction-router
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: matrix.language == 'c-cpp' && github.event.repository.name == 'abstraction-facade'
        with:
          repository: openabstractions/abstraction-storage
          ref: ${{ steps.siblings.outputs.storage }}
          path: abstraction-storage
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: matrix.language == 'c-cpp' && github.event.repository.name == 'abstraction-facade'
        with:
          repository: openabstractions/abstraction-model
          ref: ${{ steps.siblings.outputs.model }}
          path: abstraction-model
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: matrix.language == 'c-cpp' && github.event.repository.name == 'abstraction-facade'
        with:
          repository: openabstractions/abstraction-download
          ref: ${{ steps.siblings.outputs.download }}
          path: abstraction-download
          persist-credentials: false
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          languages: ${{ matrix.language }}
          source-root: ${{ github.workspace }}/${{ matrix.language == 'actions' && '.' || github.event.repository.name }}
          build-mode: ${{ (matrix.language == 'c-cpp' || matrix.language == 'go') && 'manual' || 'none' }}
      - name: compile Go for analysis
        if: matrix.language == 'go'
        working-directory: ${{ github.event.repository.name }}/go
        run: go build -mod=readonly ./...
      - name: compile native client for analysis
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          case "$REPOSITORY" in
            abstraction-config|abstraction-logging|abstraction-router|abstraction-facade) ;;
            *) echo 'Unsupported service-client repository'; exit 1 ;;
          esac
          cmake -S "$REPOSITORY/cpp" -B "$RUNNER_TEMP/native" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_abstraction_ipc=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_abstraction_logging=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_abstraction_config=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_abstraction_router=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_abstraction_job_acceptance=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_abstraction_model=TRUE
          cmake --build "$RUNNER_TEMP/native" --parallel 2
          capability="${REPOSITORY#abstraction-}"
          printf '#include <abstraction/%s/client.hpp>\nint main() { return 0; }\n' "$capability" > "$REPOSITORY/cpp/codeql_client.cpp"
          includes=(-I "$REPOSITORY/cpp/include" -I "$REPOSITORY/cpp" -I abstraction-identity/cpp/include)
          if [ "$capability" = facade ]; then
            for dependency in logging config router job model download storage; do
              includes+=(-I "abstraction-$dependency/cpp/include" -I "abstraction-$dependency/cpp")
            done
          fi
          g++ -std=c++17 "${includes[@]}" -c "$REPOSITORY/cpp/codeql_client.cpp" -o "$RUNNER_TEMP/codeql_client.o"
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          category: /language:${{ matrix.language }}
